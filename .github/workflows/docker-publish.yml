# 2026-05-24 hoyeon.han
# Docker Hub 자동 빌드/푸시 워크플로우
# 기존 트리거: 수동 실행(workflow_dispatch) 또는 v* 형식의 git 태그 푸시
# 2026-11-04 hoyeon.han: main 병합 뒤 인증·정산·실제 이미지 검증을 통과해야 게시한다.
# 이미지: hoyeonhan/sollume-lab (linux/amd64, linux/arm64)
# 필요한 GitHub Secrets:
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN  (Docker Hub Personal Access Token, Read & Write)

name: Build and Push Docker Image

on:
  workflow_dispatch:
  # 2026-11-04 hoyeon.han: PR도 검증하지만 외부 이미지 게시 단계는 실행하지 않는다.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

# 2026-11-04 hoyeon.han: main과 버전 태그 게시가 동시에 진행되지 않게 한다.
concurrency:
  group: sollume-docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: hoyeonhan/sollume-lab

jobs:
  build-and-push:
    name: Build (amd64+arm64) and Push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2026-11-04 hoyeon.han: 운영 의존성과 Python 가상환경으로 회귀를 먼저 검증한다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify authentication, settlement and deployment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements.txt pytest
          .venv-ci/bin/python -m pytest .codex/tests tests/test_ecount_settlement.py -p no:cacheprovider -q
          bash -n deploy-oracle.sh rollback-oracle.sh

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 기존 로그인 위치 보존. 2026-11-04 hoyeon.han: 아래 실제 이미지 검사 뒤로 이동했다.
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2026-11-04 hoyeon.han: 게시 전 실제 이미지의 가상환경·MFA·다운로드·비용 열을 확인한다.
      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sollume-finance-verify:${{ github.sha }}
          cache-from: type=gha,scope=sollume-verify-amd64
          cache-to: type=gha,mode=max,scope=sollume-verify-amd64

      - name: Verify actual image runtime
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /opt/venv/bin/python sollume-finance-verify:${{ github.sha }} /app/scripts/verify_image_runtime.py

      # 기존에는 이미지 검증 전 로그인했다. 2026-11-04 hoyeon.han: 검증 뒤 게시 단계에서만 로그인한다.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # 2026-11-04 hoyeon.han: 예전 버전 태그가 운영 latest를 덮어쓰지 않게 한다.
          flavor: latest=false
          # 기존: type=raw,value=latest,enable={{is_default_branch}}
          # 기존: type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 2026-11-04 hoyeon.han: 먼저 검증한 amd64 빌드 캐시도 재사용한다.
          # cache-from: type=gha
          cache-from: |
            type=gha
            type=gha,scope=sollume-verify-amd64
          cache-to: type=gha,mode=max

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Pushed tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
