# 2026-05-24 hoyeon.han
# Docker Hub 자동 빌드/푸시 워크플로우
# 기존 트리거: 수동 실행(workflow_dispatch) 또는 v* 형식의 git 태그 푸시
# 2026-11-04 hoyeon.han: main 병합 뒤 인증·정산·실제 이미지 검증을 통과해야 게시한다.
# 2026-11-18 hoyeon.han: v* 태그는 다시 빌드하지 않고 main에서 검증·게시된 sha-<커밋> 이미지에 버전 태그만 붙인다.
# 이미지: hoyeonhan/sollume-lab (linux/amd64, linux/arm64)
# 필요한 GitHub Secrets:
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN  (Docker Hub Personal Access Token, Read & Write)

name: Build and Push Docker Image

on:
  workflow_dispatch:
  # 2026-11-04 hoyeon.han: PR도 검증하지만 외부 이미지 게시 단계는 실행하지 않는다.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

# 2026-11-04 hoyeon.han: main과 버전 태그 게시가 동시에 진행되지 않게 한다.
concurrency:
  group: sollume-docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: hoyeonhan/sollume-lab

jobs:
  build-and-push:
    name: Build (amd64+arm64) and Push to Docker Hub
    # 2026-11-18 hoyeon.han: 버전 태그 실행은 아래 release-retag job이 처리한다(같은 커밋 중복 빌드 방지).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2026-11-04 hoyeon.han: 운영 의존성과 Python 가상환경으로 회귀를 먼저 검증한다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify authentication, settlement and deployment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements.txt pytest
          # .venv-ci/bin/python -m pytest .codex/tests tests/test_ecount_settlement.py -p no:cacheprovider -q
          # 2026-11-05 hoyeon.han: 재사용 테스트는 정식 tests 경로에서 실행한다.
          # .venv-ci/bin/python -m pytest tests/security tests/operations tests/test_ecount_settlement.py tests/test_ecount_purchase_settlement.py tests/test_seller_settlement.py tests/test_period_summary.py -p no:cacheprovider -q
          # 2026-11-20 hoyeon.han: 이카운트 정산서 비용조정 테스트를 추가한다.
          .venv-ci/bin/python -m pytest tests/security tests/operations tests/test_ecount_settlement.py tests/test_ecount_purchase_settlement.py tests/test_seller_settlement.py tests/test_period_summary.py tests/test_cost_adjustment.py -p no:cacheprovider -q
          bash -n deploy-oracle.sh rollback-oracle.sh

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 기존 로그인 위치 보존. 2026-11-04 hoyeon.han: 아래 실제 이미지 검사 뒤로 이동했다.
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2026-11-04 hoyeon.han: 게시 전 실제 이미지의 가상환경·MFA·다운로드·비용 열을 확인한다.
      - name: Build verification image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: sollume-finance-verify:${{ github.sha }}
          cache-from: type=gha,scope=sollume-verify-amd64
          cache-to: type=gha,mode=max,scope=sollume-verify-amd64

      - name: Verify actual image runtime
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /opt/venv/bin/python sollume-finance-verify:${{ github.sha }} /app/scripts/verify_image_runtime.py

      # 기존에는 이미지 검증 전 로그인했다. 2026-11-04 hoyeon.han: 검증 뒤 게시 단계에서만 로그인한다.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # 2026-11-04 hoyeon.han: 예전 버전 태그가 운영 latest를 덮어쓰지 않게 한다.
          flavor: latest=false
          # 기존: type=raw,value=latest,enable={{is_default_branch}}
          # 기존: type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 2026-11-04 hoyeon.han: 먼저 검증한 amd64 빌드 캐시도 재사용한다.
          # cache-from: type=gha
          cache-from: |
            type=gha
            type=gha,scope=sollume-verify-amd64
          cache-to: type=gha,mode=max

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Pushed tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # 2026-11-18 hoyeon.han: 버전 태그는 main에서 이미 검증·게시된 이미지에 태그만 추가한다.
  # 다시 빌드·검증하지 않으며 latest는 바꾸지 않는다(latest는 main 게시에서만 갱신).
  release-retag:
    name: Tag verified main image with release version
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release commit (release retag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # main에 병합되지 않은 커밋(예: 다른 브랜치 수동 실행 이미지)에 버전 태그가 붙지 않게 한다.
      - name: Check release commit is on main (release retag)
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::태그 커밋 ${GITHUB_SHA::7}이 main에 없습니다. main에 병합한 커밋에 태그를 만드세요."
            exit 1
          fi

      - name: Set up Docker Buildx (release retag)
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (release retag)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release version tags (release retag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # main 게시 job의 type=sha,prefix=sha-,format=short(7자리)와 같은 이름의 이미지를 원본으로 쓴다.
      - name: Add version tags to verified image (release retag)
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          SOURCE="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$SOURCE" > /dev/null; then
            echo "::error::검증·게시된 이미지 $SOURCE 가 없습니다. main 병합 후 Actions 게시가 성공했는지 확인하고 태그를 다시 푸시하세요."
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in *:latest) echo "::error::릴리스 태그 실행에서는 latest를 바꾸지 않습니다."; exit 1 ;; esac
            args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::태그 이름에서 버전을 읽지 못했습니다. v3.4.7 형식으로 만드세요."
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          {
            echo "### Retagged $SOURCE"
            echo '```'
            echo "$RELEASE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
