# 2026-10-14 hoyeon.han: 필수 인증·내부 포트 제한 구성
worker_processes auto;
events { worker_connections 1024; }
http {

# http { } 안에서 읽는 구성이다. 호스트용은 sites-enabled에 배치한다.
# 2026-10-14 hoyeon.han: 운영 도메인은 AUTH_PUBLIC_ORIGIN과 반드시 일치해야 한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map "$http_upgrade:$http_accept" $is_browser_page {
    default 0;
    ~*^:.*text/html 1;
}
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
    # return 301 https://sollumeesthe.com$request_uri;
    return 301 https://office1.sollumeesthe.com$request_uri;
}
server {
    listen 443 ssl default_server;
    # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
    # server_name sollumeesthe.com;
    server_name office1.sollumeesthe.com;
    # 실제 TLS 인증서 파일을 준비해야 한다. 더미 인증서나 HTTP 폴백은 제공하지 않는다.
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 300M;

    # 공개 호스트 이외의 요청은 라우팅하지 않는다.
    # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
    # if ($host != sollumeesthe.com) { return 444; }
    if ($host != office1.sollumeesthe.com) { return 444; }

    # 인증 검사는 Nginx 내부 요청만 가능하며 캐시하거나 요청 본문을 전달하지 않는다.
    location = /_auth_check {
        internal;
        proxy_pass http://sollume-auth:8503/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header Host sollumeesthe.com;
        proxy_set_header Host office1.sollumeesthe.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header X-Forwarded-Host sollumeesthe.com;
        proxy_set_header X-Forwarded-Host office1.sollumeesthe.com;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }
    location = /auth/check { return 404; }
    location = /auth/health { return 404; }
    # 2026-10-21 hoyeon.han: Streamlit의 연결 준비 요청도 아래 location /에서 로그인 검사 후 실제 상태를 전달한다.
    # location = /_stcore/health { return 404; }

    # 비밀번호 및 MFA 입력은 인증 서버에서만 처리한다. 기존 헤더의 IP를 신뢰하지 않는다.
    location ^~ /auth/ {
        limit_req zone=auth_login burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1M;
        proxy_pass http://sollume-auth:8503;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header Host sollumeesthe.com;
        proxy_set_header Host office1.sollumeesthe.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header X-Forwarded-Host sollumeesthe.com;
        proxy_set_header X-Forwarded-Host office1.sollumeesthe.com;
        proxy_cache off;
        access_log off;
    }

    # Streamlit의 기존 media URL은 로그인 여부와 관계없이 차단한다.
    location = /media { return 403; }
    location ^~ /media/ { return 403; }

    # 파일은 인증 서버가 세션·소유자·화면 권한·만료를 다시 검사한다.
    location ^~ /downloads/ {
        auth_request /_auth_check;
        proxy_pass http://sollume-auth:8503;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header Host sollumeesthe.com;
        proxy_set_header Host office1.sollumeesthe.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header X-Forwarded-Host sollumeesthe.com;
        proxy_set_header X-Forwarded-Host office1.sollumeesthe.com;
        proxy_cache off;
        proxy_read_timeout 120s;
        access_log off;
    }

    # 기존 발주내역 API는 Flask의 X-API-Key 인증만으로 접근한다.
    location ^~ /api/ {
        proxy_pass http://sollume-api:8502;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header Host sollumeesthe.com;
        proxy_set_header Host office1.sollumeesthe.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_cache off;
    }

    # root·직접 페이지 URL·WebSocket·upload·static 등 모든 Streamlit 요청을 보호한다.
    location / {
        auth_request /_auth_check;
        error_page 401 = @auth_denied;
        proxy_pass http://sollume-app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header Host sollumeesthe.com;
        proxy_set_header Host office1.sollumeesthe.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 2026-10-19 hoyeon.han: office1의 인증서·공개 호스트를 사용한다.
        # proxy_set_header X-Forwarded-Host sollumeesthe.com;
        proxy_set_header X-Forwarded-Host office1.sollumeesthe.com;
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-Role "";
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location @auth_denied {
        if ($is_browser_page = 1) { return 302 /auth/login; }
        # WS·업로드·프로그램 호출은 로그인 페이지로 성공 응답을 위장하지 않는다.
        return 401;
    }
}

}
