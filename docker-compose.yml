# 2026-10-14 hoyeon.han: 필수 인증·내부 포트 제한 구성
services:
  sollume-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sollume-finance-app
    expose:
      - "8501"
    volumes:
      - ./logs:/app/logs
      - ./processed:/app/processed
      - ./uploads:/app/uploads
      - ./database:/app/database
      - ./order_data:/app/order_data
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      AUTH_ENV: production
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?HTTPS 공개 도메인 설정이 필요합니다}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?인증 암호화 키 설정이 필요합니다}
      AUTH_DB_PATH: /app/database/users.db
      AUTH_DOWNLOAD_DIR: /app/processed/secure_downloads
      STREAMLIT_SERVER_ENABLE_CORS: "true"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
      STREAMLIT_SERVER_RUN_ON_SAVE: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_BROWSER_SERVER_ADDRESS: sollumeesthe.com
      STREAMLIT_BROWSER_SERVER_PORT: "443"
      TRUSTED_PROXY_NETWORKS: 172.30.0.10/32,127.0.0.1/32
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - sollume-network

  # 인증 서버는 회계앱과 사용자 DB 및 비공개 다운로드 저장소를 공유한다.
  sollume-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sollume-finance-auth
    command: ["gunicorn", "--bind", "0.0.0.0:8503", "--workers", "2", "--timeout", "60", "--pythonpath", "/app/Src", "auth_gateway:create_app()"]
    expose:
      - "8503"
    volumes:
      - ./database:/app/database
      - ./processed:/app/processed
      - ./logs:/app/logs
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      AUTH_ENV: production
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:?HTTPS 공개 도메인 설정이 필요합니다}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?인증 암호화 키 설정이 필요합니다}
      AUTH_DB_PATH: /app/database/users.db
      AUTH_DOWNLOAD_DIR: /app/processed/secure_downloads
      TRUSTED_PROXY_NETWORKS: 172.30.0.10/32,127.0.0.1/32
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128M
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: sollumeesthe.com", "http://localhost:8503/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - sollume-network

  # 기존 자동화 API는 브라우저 로그인과 별개의 X-API-Key 인증을 유지한다.
  sollume-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sollume-finance-api
    command: ["gunicorn", "--bind", "0.0.0.0:8502", "--workers", "2", "--timeout", "120", "--pythonpath", "/app/Src", "api_server:app"]
    expose:
      - "8502"
    volumes:
      - ./logs:/app/logs
      - ./order_data:/app/order_data:ro
    environment:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      ORDER_API_KEY: ${ORDER_API_KEY:?기존 자동화 API 키 설정이 필요합니다}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - sollume-network

  nginx:
    image: nginx:alpine
    container_name: sollume-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 실제 인증서만 준비한다. 없거나 읽을 수 없으면 Nginx 시작이 실패한다.
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      sollume-app:
        condition: service_healthy
      sollume-auth:
        condition: service_healthy
      sollume-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      sollume-network:
        ipv4_address: 172.30.0.10

networks:
  sollume-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
